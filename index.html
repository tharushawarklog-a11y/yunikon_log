<!DOCTYPE html>
<html lang="si" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data: blob:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b1120" id="metaTheme">
<title>Yunikon Auto — Daily Work &amp; Documentation Log</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='1' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='%23dc2626'/%3E%3Cstop offset='1' stop-color='%232563eb'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='44' font-size='34' font-family='Arial' font-weight='800' text-anchor='middle' fill='white'%3EY%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f7;--surface:rgba(255,255,255,.86);--surface-solid:#fff;--border:rgba(15,23,42,.10);
  --text:#0f172a;--muted:#64748b;--input:#f8fafc;--input-border:#cbd5e1;
  --brand:#2563eb;--brand-h:#1d4ed8;--red:#dc2626;--ok:#059669;--warn:#d97706;
  --ok-bg:rgba(5,150,105,.12);--warn-bg:rgba(217,119,6,.14);--red-bg:rgba(220,38,38,.12);--brand-bg:rgba(37,99,235,.12);
  --shadow:0 10px 30px -12px rgba(15,23,42,.18);--radius:18px;color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#080d1a;--surface:rgba(17,24,39,.78);--surface-solid:#111827;--border:rgba(255,255,255,.09);
  --text:#e5e7eb;--muted:#94a3b8;--input:#0b1220;--input-border:#263349;
  --brand:#3b82f6;--brand-h:#2563eb;--red:#f87171;--ok:#34d399;--warn:#fbbf24;
  --ok-bg:rgba(52,211,153,.13);--warn-bg:rgba(251,191,36,.13);--red-bg:rgba(248,113,113,.13);--brand-bg:rgba(59,130,246,.16);
  --shadow:0 18px 40px -16px rgba(0,0,0,.7);color-scheme:dark;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:'Inter','Noto Sans Sinhala','Iskoola Pota','Nirmala UI',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;overscroll-behavior-y:none;transition:background .25s,color .25s}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(620px 420px at 6% -6%,rgba(220,38,38,.17),transparent 62%),radial-gradient(760px 520px at 98% -4%,rgba(37,99,235,.2),transparent 62%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1320px;margin:0 auto;padding:12px 14px 96px}
@media(min-width:900px){.wrap{padding:18px 22px 40px}}

/* header */
.top{position:sticky;top:0;z-index:30;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:var(--surface);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}
.top-in{max-width:1320px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
@media(min-width:900px){.top-in{padding:12px 22px}}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#dc2626,#2563eb);display:grid;place-items:center;color:#fff;box-shadow:0 8px 20px -6px rgba(220,38,38,.55);flex:none}
.logo .i{width:24px;height:24px}
.brand h1{font-size:18px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.brand h1 b{color:var(--red)}
.brand p{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
@media(min-width:700px){.brand h1{font-size:21px}.brand p{max-width:none;font-size:12.5px}}
.top-act{display:flex;gap:8px;align-items:center}
.icon-btn{height:40px;min-width:40px;padding:0 12px;border-radius:12px;background:var(--surface-solid);border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:13px;transition:.15s}
.icon-btn:hover{border-color:var(--brand);color:var(--brand)}
html[data-theme="dark"] .ic-moon,html:not([data-theme="dark"]) .ic-sun{display:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:12px;font-weight:700;font-size:13.5px;border:1px solid transparent;transition:.15s;min-height:42px}
.btn.sm{padding:6px 12px;min-height:34px;font-size:12.5px}
.btn.primary{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;box-shadow:0 10px 22px -10px rgba(37,99,235,.8)}
.btn.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.ghost{background:var(--surface-solid);border-color:var(--border)}
.btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn.danger{background:var(--red);color:#fff}
html[data-theme="dark"] .btn.danger{color:#1f0707}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn.tool{background:var(--surface-solid);border-color:var(--border);padding:8px 12px;min-height:38px;font-size:12.5px}
.btn.tool:hover{border-color:var(--brand);color:var(--brand)}
.btn.csv{background:#059669;color:#fff;border-color:transparent}
.btn.csv:hover{background:#047857;color:#fff}

/* panels */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border)}
.panel-head h2{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.panel-head h2 .i{color:var(--brand)}
.panel-body{padding:16px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
@media(min-width:900px){.stats{grid-template-columns:repeat(4,1fr);gap:14px}}
.stat{text-align:left;padding:14px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;transition:.18s;position:relative;overflow:hidden}
.stat:hover{transform:translateY(-2px)}
.stat.active{outline:2px solid var(--brand)}
.stat .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:19px}
.stat small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.stat strong{font-size:24px;font-weight:800;line-height:1.1}
.stat.t .ico{background:var(--brand-bg)}.stat.d .ico,.stat.d strong{background:var(--ok-bg);color:var(--ok)}.stat.d strong{background:none}
.stat.p .ico{background:var(--warn-bg)}.stat.p strong{color:var(--warn)}
.stat.n .ico{background:var(--red-bg)}.stat.n strong{color:var(--red)}
.progress{height:6px;border-radius:99px;background:var(--border);overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#059669,#34d399);transition:width .5s}

/* layout */
.layout{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media(min-width:1024px){.layout{grid-template-columns:400px minmax(0,1fr);gap:18px;align-items:start}.form-panel{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto}}
.form-panel.collapsed .panel-body,.form-panel.collapsed .banner{display:none}
.form-toggle{display:inline-flex}
@media(min-width:1024px){.form-toggle{display:none}}

/* form */
.grid2{display:grid;gap:12px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.grid2 .field{margin-bottom:0}.grid2{margin-bottom:12px}
.field label,.lbl{font-size:12px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:6px}
.link-btn{font-size:11.5px;font-weight:800;color:var(--brand)}
.link-btn:hover{text-decoration:underline}
input,select,textarea{font:inherit;font-size:14px;color:var(--text);background:var(--input);border:1px solid var(--input-border);border-radius:12px;padding:10px 12px;width:100%;min-width:0;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-bg)}
textarea{resize:vertical;min-height:84px}
input[type="date"],input[type="time"]{-webkit-appearance:none;appearance:none;display:block;min-height:44px;max-width:100%;line-height:1.2;text-align:left}
input[type="date"]::-webkit-date-and-time-value,input[type="time"]::-webkit-date-and-time-value{text-align:left;min-height:1.2em;margin:0}
input[type="date"]::-webkit-calendar-picker-indicator,input[type="time"]::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.7;filter:invert(.45)}
html[data-theme="dark"] input[type="date"]::-webkit-calendar-picker-indicator,html[data-theme="dark"] input[type="time"]::-webkit-calendar-picker-indicator{filter:invert(.85)}
@media(max-width:700px){input,select,textarea{font-size:16px}}
.banner{margin:12px 16px 0;padding:9px 12px;border-radius:12px;background:var(--brand-bg);color:var(--brand);font-size:12.5px;font-weight:600;border:1px solid rgba(59,130,246,.3)}
.drop{border:2px dashed var(--input-border);border-radius:14px;padding:16px;text-align:center;cursor:pointer;color:var(--muted);font-size:13px;transition:.15s;background:var(--input)}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-bg)}
.drop .i{width:28px;height:28px;color:var(--brand);margin-bottom:4px}
.drop small{opacity:.8;font-size:11.5px}
.pill{padding:2px 10px;border-radius:99px;font-size:11.5px;font-weight:800;background:var(--brand-bg);color:var(--brand)}
.pill.full{background:var(--red-bg);color:var(--red)}
.previews{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.prev{position:relative;width:68px;height:68px;border-radius:12px;overflow:hidden;border:1px solid var(--border)}
.prev img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.prev button{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center}
html[data-theme="dark"] .prev button{color:#200}
.prev button .i{width:11px;height:11px;stroke-width:3}
.form-actions{display:flex;gap:8px;margin-top:6px}
.form-actions .btn.primary{flex:1}

/* tools / filters */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filters{padding:12px;display:grid;gap:8px;margin-bottom:12px}
.search{position:relative}
.search .i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:16px;height:16px}
.search input{padding-left:36px}
.frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(min-width:760px){.frow{grid-template-columns:repeat(5,minmax(0,1fr))}}
.frow input,.frow select{font-size:13px;padding:9px 10px}
@media(max-width:700px){.frow input,.frow select{font-size:16px}}
.count-line{font-size:12px;color:var(--muted);font-weight:600;margin:2px 4px 10px}

/* cards */
.list{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.day-head{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin-top:6px;font-size:12.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.day-head::after{content:"";flex:1;height:1px;background:var(--border)}
.day-head span{padding:1px 8px;border-radius:99px;background:var(--brand-bg);color:var(--brand)}
.card{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--muted);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);transition:transform .18s,border-color .18s;animation:pop .25s ease both;min-width:0}
.card:hover{transform:translateY(-2px)}
.card.s-done{border-left-color:var(--ok)}.card.s-prog{border-left-color:var(--warn)}.card.s-todo{border-left-color:var(--red)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.badge{padding:3px 11px;border-radius:99px;font-size:11.5px;font-weight:800;border:1px solid transparent;text-align:left;transition:.15s}
.badge:hover{filter:brightness(1.1);transform:scale(1.03)}
.badge.done{background:var(--ok-bg);color:var(--ok);border-color:rgba(5,150,105,.25)}
.badge.prog{background:var(--warn-bg);color:var(--warn);border-color:rgba(217,119,6,.25)}
.badge.todo{background:var(--red-bg);color:var(--red);border-color:rgba(220,38,38,.25)}
.chip{padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;background:var(--input);border:1px solid var(--border);color:var(--muted);max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card h3{font-size:14.5px;font-weight:700;line-height:1.4;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--muted);font-weight:600}
.notes{font-size:12.5px;background:var(--input);padding:8px 10px;border-radius:10px;border-left:3px solid var(--brand);white-space:pre-line;overflow-wrap:anywhere;color:var(--muted);max-height:120px;overflow:auto}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.thumb{width:58px;height:58px;border-radius:11px;overflow:hidden;border:1px solid var(--border);padding:0;flex:none;transition:.15s;position:relative}
.thumb:hover{transform:scale(1.06);border-color:var(--brand)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.card-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);padding-top:8px;margin-top:auto}
.mini{display:inline-flex;align-items:center;gap:5px;padding:6px 8px;border-radius:9px;font-size:12px;font-weight:700;color:var(--muted);transition:.15s}
.mini:hover{color:var(--brand);background:var(--brand-bg)}
.mini.del:hover{color:var(--red);background:var(--red-bg)}
.mini .i{width:15px;height:15px}
.empty{grid-column:1/-1;text-align:center;padding:46px 10px;color:var(--muted)}
.empty .em{font-size:40px;opacity:.7}
.more{display:flex;justify-content:center;margin-top:14px}
.foot{text-align:center;font-size:11.5px;color:var(--muted);padding:18px 0 4px}

/* fab */
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:25;width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,#dc2626,#2563eb);color:#fff;display:grid;place-items:center;box-shadow:0 14px 28px -8px rgba(37,99,235,.7)}
.fab .i{width:26px;height:26px;stroke-width:2.6}
@media(min-width:1024px){.fab{display:none}}

/* overlays */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(2,6,23,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:14px;opacity:0;pointer-events:none;transition:opacity .18s}
.overlay.open{opacity:1;pointer-events:auto}
.modal{width:100%;max-width:440px;background:var(--surface-solid);border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:0 30px 60px -20px rgba(0,0,0,.7);max-height:92vh;overflow:auto}
.modal h3{font-size:16px;font-weight:800;margin-bottom:6px}
.modal p{font-size:13px;color:var(--muted);margin-bottom:14px}
.modal .row{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.sec{border-top:1px solid var(--border);padding-top:14px;margin-top:14px}
.sec h4{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.sec .field{margin-bottom:8px}
.hint{font-size:11.5px;color:var(--muted);margin-top:4px}
#lightbox{background:rgba(2,6,23,.92);flex-direction:column;gap:12px;z-index:70}
#lightbox img{max-width:100%;max-height:78vh;border-radius:12px;object-fit:contain;box-shadow:0 20px 60px rgba(0,0,0,.6);background:#fff}
.lb-bar{display:flex;gap:8px;align-items:center;color:#fff;font-size:13px;font-weight:700}
.lb-bar .btn{background:#1e293b;color:#fff;min-height:38px;padding:8px 14px}
.lb-bar a,.lb-bar .btn.primary{background:var(--brand)}
.lb-close{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;width:40px;height:40px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center}
#lock{z-index:90;background:var(--bg)}
#lock .modal{text-align:center;max-width:360px}
#lock .logo{margin:0 auto 12px;width:58px;height:58px;border-radius:18px}
#lockErr{color:var(--red);font-size:12.5px;font-weight:700;min-height:18px;margin-top:8px}

/* toast */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));z-index:100;display:flex;flex-direction:column;gap:8px;width:min(92vw,380px);pointer-events:none}
.toast{padding:11px 14px;border-radius:12px;color:#fff;font-size:13px;font-weight:700;box-shadow:0 14px 30px -10px rgba(0,0,0,.6);animation:tin .25s ease both;background:#2563eb}
.toast.success{background:#059669}.toast.danger{background:#dc2626}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.cdot{width:9px;height:9px;border-radius:50%;background:#94a3b8;display:inline-block;flex:none}
.cdot.ok{background:#10b981}.cdot.idle{background:#3b82f6}.cdot.syncing{background:#3b82f6;animation:pulse 1s infinite}.cdot.error,.cdot.offline,.cdot.auth{background:#f59e0b}
@keyframes pulse{50%{opacity:.25}}
.print-only{display:none}
noscript{display:block;padding:20px;text-align:center;font-weight:700}

/* print */
@media print{
  html[data-theme="dark"],html[data-theme="light"],html{--bg:#fff;--surface:#fff;--surface-solid:#fff;--text:#000;--muted:#444;--input:#f6f6f6;--border:#cfcfcf;--shadow:none;--ok:#047857;--warn:#b45309;--red:#b91c1c;--brand:#1d4ed8;color-scheme:light}
  body{background:#fff!important;color:#000!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body::before{display:none}
  .top,.form-panel,.toolbar,.filters,.fab,.more,#toasts,.card-foot,.foot,.count-line,.stats .progress,.overlay{display:none!important}
  .wrap{padding:0;max-width:none}
  .print-only{display:block}
  .print-head{border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:10px}
  .print-head h1{font-size:20px;font-weight:800}
  .print-head p{font-size:11.5px;color:#444}
  .stats{grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
  .stat{box-shadow:none;border:1px solid #ccc;padding:6px 8px;backdrop-filter:none}
  .stat .ico{display:none}.stat strong{font-size:16px}
  .layout{display:block}
  .list{display:block}
  .card{box-shadow:none;border:1px solid #bbb;border-left-width:4px;break-inside:avoid;margin-bottom:8px;animation:none;backdrop-filter:none;padding:9px}
  .day-head{break-after:avoid;margin:10px 0 6px;color:#000}
  .notes{max-height:none;overflow:visible}
  .thumbs{flex-wrap:wrap;overflow:visible}
  .thumb{width:54px;height:54px}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></symbol>

/* ------------------------------ IndexedDB engine ------------------------------ */
const DB_NAME = 'YunikonAutoV2';
function openDB() {
  return new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('no idb'));
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('logs')) d.createObjectStore('logs', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('images')) d.createObjectStore('images', { keyPath: 'key' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('blocked'));
  });
}
const reqP = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const txDone = tx => new Promise((res, rej) => { tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error('abort')); });
const imgRange = id => IDBKeyRange.bound(id + ':', id + ':\uffff');

async function dbAllLogs() { return reqP(db.transaction('logs').objectStore('logs').getAll()); }
async function dbSave(rec, fulls) {
  const tx = db.transaction(['logs', 'images'], 'readwrite');
  const imgs = tx.objectStore('images');
  imgs.delete(imgRange(rec.id));
  fulls.forEach((d, i) => imgs.put({ key: rec.id + ':' + i, logId: rec.id, data: d }));
  tx.objectStore('logs').put(rec);
  await txDone(tx);
}
async function dbPutLog(rec) { const tx = db.transaction('logs', 'readwrite'); tx.objectStore('logs').put(rec); await txDone(tx); }
async function dbPutImages(id, arr) {
  const tx = db.transaction('images', 'readwrite'), s = tx.objectStore('images');
  s.delete(imgRange(id)); arr.forEach((d, i) => s.put({ key: id + ':' + i, logId: id, data: d }));
  await txDone(tx);
}
async function dbPutDropImages(rec) {
  const tx = db.transaction(['logs', 'images'], 'readwrite');
  tx.objectStore('logs').put(rec); tx.objectStore('images').delete(imgRange(rec.id));
  await txDone(tx);
}
async function dbImages(id) {
  const all = await reqP(db.transaction('images').objectStore('images').getAll(imgRange(id)));
  all.sort((a, b) => parseInt(a.key.split(':')[1], 10) - parseInt(b.key.split(':')[1], 10));
  return all.map(x => x.data).filter(isSafeImg);
}
async function dbDelete(id) {
  const tx = db.transaction(['logs', 'images'], 'readwrite');
  tx.objectStore('logs').delete(id); tx.objectStore('images').delete(imgRange(id));
  await txDone(tx);
}
async function dbClear() {
  const tx = db.transaction(['logs', 'images'], 'readwrite');
  tx.objectStore('logs').clear(); tx.objectStore('images').clear();
  await txDone(tx);
}

/* Import data from the previous version of this app (YunikonAutoProDB), once. */
async function migrateLegacy() {
  if (lsGet('yk_migrated') === '1') return;
  try {
    if (!indexedDB.databases) { lsSet('yk_migrated', '1'); return; }
    const list = await indexedDB.databases();
    if (!list.some(d => d.name === 'YunikonAutoProDB')) { lsSet('yk_migrated', '1'); return; }
    const old = await new Promise((res, rej) => { const r = indexedDB.open('YunikonAutoProDB'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    if (!old.objectStoreNames.contains('work_logs')) { old.close(); lsSet('yk_migrated', '1'); return; }
    const items = await reqP(old.transaction('work_logs').objectStore('work_logs').getAll());
    old.close();
    let n = 0;
    for (const it of items) {
      const norm = await normalizeImported(it);
      if (norm) { await dbSave(norm.rec, norm.fulls); n++; }
    }
    lsSet('yk_migrated', '1');
    if (n) toast(t('tMigrated', { n }), 'success');
  } catch (e) { /* leave flag unset: try again next load */ }
}

/* ------------------------------ Image processing ------------------------------ */
function srcToImg(src) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('img')); im.src = src; });
}
function fileToImg(file) {
  const u = URL.createObjectURL(file);
  return srcToImg(u).finally(() => URL.revokeObjectURL(u));
}
function scaleImg(img, max, q) {
  const w0 = img.naturalWidth, h0 = img.naturalHeight, k = Math.min(1, max / Math.max(w0, h0));
  const w = Math.max(1, Math.round(w0 * k)), h = Math.max(1, Math.round(h0 * k));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
  return c.toDataURL('image/jpeg', q);
}
async function thumbFromDataUrl(d) { return scaleImg(await srcToImg(d), THUMB_DIM, THUMB_Q); }

async function addFiles(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;
  const slots = MAX_PHOTOS - state.attached.length - state.pending;
  if (slots <= 0) { toast(t('tMax'), 'danger'); return; }
  if (files.length > slots) toast(t('tMax'), 'danger');
  const take = files.slice(0, slots);
  state.pending += take.length;
  let skipped = false;
  for (const f of take) {
    try {
      if (!/^image\//.test(f.type) || f.size > MAX_FILE) throw new Error('skip');
      const im = await fileToImg(f);
      state.attached.push({ full: scaleImg(im, FULL_DIM, FULL_Q), thumb: scaleImg(im, THUMB_DIM, THUMB_Q) });
      state.imgDirty = true;
      renderPreviews();
    } catch (e) { skipped = true; }
    finally { state.pending--; }
  }
  if (skipped) toast(t('tBadFile'), 'danger');
}

function renderPreviews() {
  const box = $('previews'); box.innerHTML = '';
  state.attached.forEach((a, i) => {
    const d = document.createElement('div'); d.className = 'prev';
    d.innerHTML = `<img src="${a.thumb}" alt="" data-i="${i}"><button type="button" data-rm="${i}" aria-label="Remove"><svg class="i"><use href="#i-x"/></svg></button>`;
    box.appendChild(d);
  });
  const n = state.attached.length, p = $('photoPill');
  p.textContent = t('attached', { n }); p.className = 'pill' + (n >= MAX_PHOTOS ? ' full' : '');
}

async function onListClick(e) {

      toast(t('tStatus', { s: t(SMAP[next].key) }), 'success'); refreshAll(); scheduleSync();
    } else if (act === 'edit' || act === 'dup') {
      const imgs = await getImages(id);

  $('lbPrev').style.opacity = i > 0 ? 1 : .4; $('lbNext').style.opacity = i < imgs.length - 1 ? 1 : .4;
}

function dataUrlToBlob(u) {
  const [h, b] = u.split(','); const mime = (h.match(/:(.*?);/) || [])[1] || 'image/jpeg';
  const bin = atob(b), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
function saveBlob(blob, name) {
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* ------------------------------ PIN lock ------------------------------ */
const b64 = u8 => btoa(String.fromCharCode(...u8));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function pbkdf(pin, saltB64, iter) {
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
  return b64(new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: unb64(saltB64), iterations: iter }, key, 256)));
}
function loadPin() { try { state.pinHash = JSON.parse(lsGet('yk_pin', 'null')); } catch (e) { state.pinHash = null; } }
async function verifyPin(pin) { const p = state.pinHash; return !!p && (await pbkdf(pin, p.s, p.i)) === p.h; }
function lockApp() {

  closeOv('lightbox'); closeOv('settings'); closeOv('confirm');
  $('app').hidden = true; $('fab').hidden = true; $('list').innerHTML = '';
  $('lock').hidden = false; openOv('lock'); $('lockPin').value = ''; $('lockErr').textContent = '';
  setTimeout(() => $('lockPin').focus(), 50);
}
function unlockApp() { $('lock').hidden = true; closeOv('lock'); $('app').hidden = false; $('fab').hidden = false; renderList(); state.lastActive = Date.now(); }
async function onUnlock(e) {

  if (Date.now() < until) { $('lockErr').textContent = t('lockWait', { s: Math.ceil((until - Date.now()) / 1000) }); return; }
  let ok = false; try { ok = await verifyPin($('lockPin').value); } catch (err) {}

  else {
    const fails = Number(lsGet('yk_fails', '0')) + 1; lsSet('yk_fails', String(fails));
    if (fails >= 5) { lsSet('yk_until', String(Date.now() + 30000 * Math.min(fails - 4, 10))); lsSet('yk_fails', '0'); $('lockErr').textContent = t('lockWait', { s: 30 }); }
    else $('lockErr').textContent = t('lockWrong');

}
async function savePin() {

/* ------------------------------ Cloud sync (Google Apps Script + Sheets + Drive) ------------------------------ */
/* Optional: paste your Web App URL here so every device only needs the access code. */
const CLOUD_URL = 'https://script.google.com/macros/s/AKfycbwLB1WZ6zFma7ZQtClz0XGUqLUq8aljFvxVBHGPjZ3Hp3ioIZPDhHHHnrAs43URXR81/exec';   // e.g. 'https://script.google.com/macros/s/AKfy.../exec'
const URL_RE = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/;
const cloud = { url: '', code: '', busy: false, again: false, status: 'off', last: 0, err: '', timer: null };

function cloudLoadCfg() {
  cloud.url = (CLOUD_URL || lsGet('yk_c_url', '')).trim();
  cloud.code = lsGet('yk_code', '');
  cloud.last = Number(lsGet('yk_last', '0')) || 0;
}
const cloudReady = () => URL_RE.test(cloud.url) && cloud.code.length >= 6;

async function gas(action, payload) {
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 90000);
  try {
    const r = await fetch(cloud.url, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // "simple" request: no CORS preflight
      body: JSON.stringify({ action, code: cloud.code, ...(payload || {}) }),
      redirect: 'follow', signal: ctl.signal, credentials: 'omit', referrerPolicy: 'no-referrer'
    });
    const j = await r.json().catch(() => null);
    if (!j) throw new Error('bad response (is the Web App deployed for "Anyone"?)');
    if (!j.ok) throw new Error(j.error || 'error');
    return j;
  } finally { clearTimeout(to); }
}
function cloudLogout(expired) {
  lsDel('yk_code'); cloud.code = ''; clearTimeout(cloud.timer);
  setCloudStatus(expired ? 'auth' : 'off');
}

const toRow = r => ({
  id: r.id, date: r.date, time: r.time, category: r.category, title: r.title, status: r.status, notes: r.notes || '',
  photoCount: r.photoCount || 0, createdAt: r.createdAt || r.id, updatedAt: r.updatedAt, thumbs: r.thumbs || []
});
function fromRow(x) {
  const id = Number(x.id); if (!Number.isSafeInteger(id) || id <= 0) return null;
  return {
    id, date: /^\d{4}-\d{2}-\d{2}$/.test(x.date) ? x.date : todayStr(), time: /^\d{2}:\d{2}$/.test(x.time) ? x.time : '00:00',
    category: clampStr(x.category, 80) || 'Other Documentation', title: clampStr(x.title, 200),
    status: STATUSES.includes(x.status) ? x.status : 'In Progress', notes: clampStr(x.notes, 5000),
    photoCount: Math.min(MAX_PHOTOS, Math.max(0, Number(x.photoCount) || 0)),
    thumbs: Array.isArray(x.thumbs) ? x.thumbs.filter(isSafeImg).slice(0, MAX_PHOTOS) : [],
    createdAt: Number(x.createdAt) || id, updatedAt: Number(x.updatedAt) || 0
  };
}

async function cloudUploadImages(id, fulls) {
  for (let i = 0; i < fulls.length; i++) await gas('putImage', { id, i, data: fulls[i] });
  if (fulls.length < MAX_PHOTOS) await gas('delImages', { id, from: fulls.length }).catch(() => {});
}
async function cloudDownloadImage(id, i) {
  const j = await gas('getImage', { id, i });
  if (!isSafeImg(j.data)) throw new Error('photo missing');
  return j.data;
}
/* Local photos first; if this device does not have them yet (record came from another device) fetch from Drive once. */
async function getImages(id) {
  const imgs = await dbImages(id);
  const rec = state.records.find(r => r.id === id);
  const need = rec ? (rec.photoCount || 0) : 0;
  if (imgs.length >= need || !cloudReady()) return imgs;
  try {
    toast(t('tPhotosLoading'), 'info');
    const out = [];
    for (let i = 0; i < need; i++) out.push(await cloudDownloadImage(id, i));
    await dbPutImages(id, out);
    return out;
  } catch (e) { toast(t('tPhotosFail'), 'danger'); return imgs; }
}

/* deletions that still have to reach the cloud */
const tombQueue = () => { try { return JSON.parse(lsGet('yk_tomb', '[]')) || []; } catch (e) { return []; } };
function tombAdd(id) { const q = tombQueue(); if (!q.includes(id)) { q.push(id); lsSet('yk_tomb', JSON.stringify(q)); } }
async function flushTombs() {
  const left = [];
  for (const id of tombQueue()) { try { await gas('delete', { id }); } catch (e) { if (e.message === 'bad_code') throw e; left.push(id); } }
  lsSet('yk_tomb', JSON.stringify(left));
  if (left.length) throw new Error('some deletions are still pending');
}

async function mergeRemote(x) {
  const id = Number(x.id), local = state.records.find(r => r.id === id);
  if (x.deleted) {
    if (!local) return false;
    await dbDelete(id); state.records = state.records.filter(r => r.id !== id);
    if (state.editId === id) resetForm();
    return true;
  }
  const rem = fromRow(x); if (!rem || !rem.title) return false;
  if (local && local.updatedAt >= rem.updatedAt) return false;   // last write wins
  rem._dirty = false; rem._imgs = false;
  await dbPutDropImages(rem);                                    // photos are re-fetched lazily
  const i = state.records.findIndex(r => r.id === id);
  if (i >= 0) state.records[i] = rem; else state.records.push(rem);
  return true;
}
async function cloudPull() {
  let cur = Number(lsGet('yk_cursor', '0')) || 0, changed = false;
  for (;;) {
    const j = await gas('pull', { since: cur, limit: 30 });
    for (const x of (j.rows || [])) changed = (await mergeRemote(x)) || changed;
    if (j.seq > cur) { cur = j.seq; lsSet('yk_cursor', String(cur)); }
    if (!j.more || !(j.rows || []).length) break;
  }
  if (changed) refreshAll();
}
async function cloudPush() {
  for (const r of state.records.filter(x => x._dirty)) {
    if (r._imgs) {
      const imgs = await dbImages(r.id);
      if (imgs.length === (r.photoCount || 0)) await cloudUploadImages(r.id, imgs);   // never overwrite cloud photos we do not hold
    }
    await gas('push', { row: toRow(r) });
    const cur = state.records.find(x => x.id === r.id);
    if (cur && cur.updatedAt === r.updatedAt) { cur._dirty = false; cur._imgs = false; await dbPutLog(cur); }
  }
}
async function syncNow(manual) {
  if (!cloudReady()) return;
  if (cloud.busy) { cloud.again = true; return; }
  if (!navigator.onLine) { setCloudStatus('offline'); return; }
  cloud.busy = true; setCloudStatus('syncing');
  try {
    await flushTombs(); await cloudPull(); await cloudPush();
    cloud.last = Date.now(); lsSet('yk_last', String(cloud.last)); setCloudStatus('ok');
    if (manual) toast(t('tSynced'), 'success');
  } catch (e) {
    if (e && e.message === 'bad_code') { cloudLogout(true); toast(t('cAuth'), 'danger'); }
    else { cloud.err = (e && e.message) || 'error'; setCloudStatus('error'); if (manual) toast(t('cErr', { m: cloud.err }), 'danger'); }
  } finally {
    cloud.busy = false;
    if (cloud.again) { cloud.again = false; scheduleSync(); }
  }
}

  bindF('qDate', 'date'); bindF('qCat', 'cat'); bindF('qStatus', 'status'); bindF('qSort', 'sort');
  $('btnReset').onclick = () => {
    state.filters = { q: '', date: '', cat: 'ALL', status: 'ALL', sort: 'desc' }; state.limit = PAGE;
    $('qSearch').value = ''; $('qDate').value = ''; $('qStatus').value = 'ALL'; $('qSort').value = 'desc'; refreshAll();
  };
  document.querySelectorAll('.stat').forEach(b => b.onclick = () => {
    const s = b.dataset.stat; state.filters.status = (state.filters.status === s ? 'ALL' : s); $('qStatus').value = state.filters.status; state.limit = PAGE; updateStats(); renderList();
  });
  $('btnMore').onclick = () => { state.limit += PAGE; renderList(); };
  $('list').addEventListener('click', onListClick);

  $('lbClose').onclick = () => closeOv('lightbox');
  $('lightbox').addEventListener('click', e => { if (e.target.id === 'lightbox') closeOv('lightbox'); });
  $('lbPrev').onclick = () => lbNav(-1); $('lbNext').onclick = () => lbNav(1); $('lbDl').onclick = lbDownload;
  let sx = null;
  $('lightbox').addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
  $('lightbox').addEventListener('touchend', e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 50) lbNav(dx < 0 ? 1 : -1); });
  document.addEventListener('keydown', e => {
    if ($('lightbox').classList.contains('open')) {
      if (e.key === 'Escape') closeOv('lightbox'); else if (e.key === 'ArrowLeft') lbNav(-1); else if (e.key === 'ArrowRight') lbNav(1);
    } else if (e.key === 'Escape') { closeOv('settings'); }
  });
  window.addEventListener('beforeunload', e => { if (isDirty() && !state.saving) { e.preventDefault(); e.returnValue = ''; } });
}

/* ------------------------------ Init ------------------------------ */
async function init() {
  const sys = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  applyTheme(lsGet('yk_theme', sys === 'light' ? 'light' : 'dark'));
  state.lang = lsGet('yk_lang', 'si') === 'en' ? 'en' : 'si';
  if (window.innerWidth < 1024) $('formPanel').classList.add('collapsed');
  cloudLoadCfg(); cloud.status = cloudReady() ? 'idle' : 'off';
  wire(); setNow(); loadPin(); applyI18n();
  if (state.pinHash) lockApp();
  try {
    db = await openDB();
    await migrateLegacy();
    state.records = (await dbAllLogs()).map(r => ({ ...r, status: STATUSES.includes(r.status) ? r.status : 'In Progress', thumbs: Array.isArray(r.thumbs) ? r.thumbs : [] }));
    refreshAll();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    if (cloudReady()) syncNow(false);
  } catch (e) { toast(t('tErrDB'), 'danger'); }
}
init();
</script>
</body>
